<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listening 卡点系统</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./config.js"></script>
    <script src="./app.js" defer></script>
  </head>
  <body class="hide-subtitles">
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">L</span>
          <div>
            <h1>Listening 卡点系统</h1>
            <p id="syncStatus">Local draft</p>
          </div>
        </div>
        <div class="top-actions">
          <select id="contentSelect" aria-label="选择内容"></select>
          <button id="openImport" class="command" type="button">导入</button>
          <button id="teacherToggle" class="icon-command" type="button" title="老师视图" aria-label="老师视图">◎</button>
        </div>
      </header>

      <main class="study-grid">
        <section class="transcript-panel" aria-label="逐句稿">
          <div class="queue-strip">
            <button class="status-chip chip-green" id="greenCount" type="button">0</button>
            <button class="status-chip chip-yellow" id="yellowCount" type="button">0</button>
            <button class="status-chip chip-red" id="redCount" type="button">0</button>
          </div>
          <ol id="sentenceList" class="sentence-list"></ol>
        </section>

        <section class="player-panel" aria-label="播放器">
          <div id="mediaMount" class="media-mount"></div>

          <div class="current-block">
            <div class="sentence-meta">
              <span id="currentIndex">01</span>
              <span id="currentTime">00:00 - 00:00</span>
              <button id="favoriteBtn" class="icon-command" type="button" title="收藏当前句" aria-label="收藏当前句">☆</button>
            </div>
            <p id="currentSentence" class="current-sentence"></p>
          </div>

          <div class="transport-bar">
            <button id="prevBtn" class="icon-command large" type="button" title="上一句" aria-label="上一句">←</button>
            <button id="replayBtn" class="icon-command primary large" type="button" title="重播当前句" aria-label="重播当前句">↻</button>
            <button id="nextBtn" class="icon-command large" type="button" title="下一句" aria-label="下一句">→</button>
            <button id="toggleSubtitles" class="command" type="button">显示字幕</button>
          </div>

          <div class="mark-bar" aria-label="理解状态">
            <button id="understoodBtn" class="mark understood" type="button">听懂</button>
            <button id="unsureBtn" class="mark unsure" type="button">不确定</button>
            <button id="missedBtn" class="mark missed" type="button">没听懂</button>
          </div>
        </section>

        <aside id="insightPanel" class="insight-panel" aria-label="卡点数据">
          <section class="metric-band">
            <div>
              <span id="accuracyRate">0%</span>
              <p>首遍通过</p>
            </div>
            <div>
              <span id="reviewSize">0</span>
              <p>复听包</p>
            </div>
          </section>

          <section>
            <h2>复听队列</h2>
            <div id="reviewList" class="review-list"></div>
          </section>

          <section id="teacherSection" class="teacher-section" hidden>
            <h2>老师视图</h2>
            <div id="teacherList" class="teacher-list"></div>
          </section>
        </aside>
      </main>
    </div>

    <dialog id="importDialog" class="import-dialog">
      <form id="importForm" method="dialog">
        <div class="dialog-head">
          <h2>导入内容</h2>
          <button id="closeImport" class="icon-command" type="button" aria-label="关闭">×</button>
        </div>
        <label>
          标题
          <input id="importTitle" name="title" autocomplete="off" placeholder="TED-Ed / YouTube / B 站标题">
        </label>
        <label>
          视频 URL
          <input id="importUrl" name="url" autocomplete="off" placeholder="https://www.youtube.com/watch?v=...">
        </label>
        <label>
          字幕
          <textarea id="importTranscript" name="transcript" rows="10" placeholder="00:00 - 00:04 First sentence.&#10;00:04 - 00:08 Second sentence."></textarea>
        </label>
        <div class="dialog-actions">
          <button class="command ghost" id="loadDemoTranscript" type="button">示例</button>
          <button class="command primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
